services:
  opensandbox-server:
    image: ${OPENSANDBOX_SERVER_IMAGE:-ghcr.io/huangpustar/fenixagent-opensandbox-server:v0.2.0}
    command: [opensandbox-server, --config, /etc/opensandbox/sandbox.toml]
    privileged: true
    cgroup: host
    restart: unless-stopped
    ports:
      - "${OPENSANDBOX_SERVER_PORT:-8090}:8080"
      - "${SANDBOX_PORT_MIN:-10000}-${SANDBOX_PORT_MAX:-10100}:${SANDBOX_PORT_MIN:-10000}-${SANDBOX_PORT_MAX:-10100}"
    volumes:
      - ./data/docker:/var/lib/docker
      - ./data/opensandbox:/root/.opensandbox
      - ./workspace:/workspace
      - ./offline:/offline:ro
      - ./sandbox.toml:/etc/opensandbox/sandbox.toml:ro
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
